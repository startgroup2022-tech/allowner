workflows:
  android-apk-debug-real:
    name: All Owners - REAL DEBUG (shows actual errors)
    max_build_duration: 30
    environment:
      flutter: 3.44.9
      vars:
        PACKAGE_NAME: "com.superai.allowners"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons and native splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build APK debug mode
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-apk-debug:
    name: All Owners - Android APK (Debug/Preview)
    max_build_duration: 30
    environment:
      flutter: 3.44.9
      vars:
        PACKAGE_NAME: "com.superai.allowners"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons & native splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build APK (release, unsigned/debug-signed)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-aab-release:
    name: All Owners - AAB (Signed Release for Google Play)
    max_build_duration: 30
    environment:
      flutter: 3.44.9
      android_signing:
        - allowners_keystor
      vars:
        PACKAGE_NAME: "com.superai.allowners"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons & native splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Set up Android signing (key.properties)
        script: |
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build App Bundle (AAB) for Google Play
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  # بوابة تحقق لا تُنتج أي ملف تثبيت: تنسيق + تحليل + اختبارات (بما فيها
  # لقطات المرجع البصرية). نسخة Flutter مثبّتة على نفس نسخة توليد اللقطات،
  # وإلا فشلت المقارنة البصرية بسبب اختلاف تنعيم الحروف بين الإصدارات.
  flutter-verify:
    name: All Owners - Verify (format, analyze, tests)
    max_build_duration: 60
    environment:
      flutter: 3.44.9
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Check formatting
        script: |
          dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        script: |
          flutter analyze
      - name: Tests
        script: |
          flutter test
    artifacts:
      - test/failures/**
